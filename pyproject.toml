[project]
name = "pgprism"
version = "0.1.0"
description = "PgPrism: Strictly read-only PostgreSQL MCP server with local SQLite profile management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "sqlglot>=25.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
pgprism = "src.server:main"
pgprism-web = "src.web:main"
mcp-postgresql = "src.server:main"
mcp-postgresql-web = "src.web:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
src = ["static/*", "static/ui/*"]

[tool.pyrefly]
search-path = ["."]
disable-search-path-heuristics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
